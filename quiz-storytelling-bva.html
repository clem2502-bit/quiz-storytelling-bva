<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quel storytelling raconter pour attirer tes futures clientes ? · BVA Académie</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rp:#E8B3E8;--rc:#F5DDF1;--cr:#FFF4E3;--or:#C6A667;--ch:#E8D5AD;--cb:#28232A;--mv:#AB78B9;--ser:'Cormorant Garamond',Georgia,serif;--san:'DM Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--san);color:var(--cb);background:linear-gradient(160deg,var(--cr),var(--rc));min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.brand{font-family:var(--ser);letter-spacing:.32em;font-size:13px;color:var(--or);text-align:center;font-weight:700;margin:6px 0 18px}
h1,h2,h3{font-family:var(--ser);line-height:1.15}
h1{font-size:36px;text-align:center;margin-bottom:14px}
h2{font-size:28px;margin-bottom:18px}
.sub{text-align:center;color:#5b5160;margin-bottom:22px}
.card{background:#fffdf8;border:1px solid var(--ch);border-radius:20px;padding:20px;box-shadow:0 6px 22px rgba(40,35,42,.07);margin-bottom:16px;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ben{list-style:none;padding:0;margin:0 0 22px}
.ben li{padding:8px 0 8px 28px;position:relative}
.ben li:before{content:"✦";position:absolute;left:4px;color:var(--or)}
.btn{font:600 16px var(--san);border:none;border-radius:999px;padding:14px 26px;cursor:pointer;transition:.2s}
.pri{background:var(--cb);color:var(--cr);box-shadow:0 0 0 2px var(--cr),0 0 0 3px var(--or)}
.pri:hover{transform:translateY(-1px)}
.pri:disabled{opacity:.35;cursor:default;transform:none}
.sec{background:transparent;color:var(--cb);border:1px solid var(--or)}
.full{width:100%;display:block}
.mini{font-size:13px;text-align:center;color:#7a6f7e;margin-top:16px}
.bar{height:8px;border-radius:9px;background:var(--cr);border:1px solid var(--ch);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rp),var(--mv));border-right:2px solid var(--or);transition:width .4s}
.step{font-size:12px;color:var(--or);letter-spacing:.12em;font-weight:600;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;font:500 16px var(--san);color:var(--cb);background:#fffdf8;border:1px solid var(--ch);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.18s}
.opt:hover{border-color:var(--or)}
.opt.on{background:var(--rc);border-color:var(--or);box-shadow:0 0 0 1px var(--or)}
input.oth{width:100%;font:16px var(--san);padding:12px 14px;border:1px solid var(--or);border-radius:14px;margin:0 0 10px;background:#fff}
.nav{display:flex;gap:10px;margin-top:14px}
.nav .btn{flex:1}
.r-tag{font-size:12px;letter-spacing:.14em;color:var(--mv);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.r h3{font-size:26px;margin-bottom:8px}
.r p{margin-bottom:8px}
.hook{border-left:3px solid var(--or);padding:6px 0 6px 12px;margin:10px 0}
.hook b{display:block;font-size:12px;color:var(--mv);letter-spacing:.06em;text-transform:uppercase}
.beat{padding:10px 0;border-top:1px dashed var(--ch)}
.beat:first-of-type{border-top:none}
.beat b{display:block;font-size:12px;color:var(--or);letter-spacing:.08em;text-transform:uppercase}
.r ul{padding-left:20px}.r li{margin-bottom:5px}
.chk{list-style:none;padding:0!important}.chk li:before{content:"☐  ";color:var(--or)}
.sig{text-align:center;background:var(--cb);color:var(--cr);border-radius:20px;padding:26px 20px;margin-bottom:16px}
.sig h3{color:var(--ch);margin-bottom:10px}
.sig .b{font-family:var(--ser);letter-spacing:.3em;color:var(--or);font-weight:700;margin-top:14px}
.sig a{color:var(--ch)}
.q{font-style:italic;color:#5b5160;border-left:3px solid var(--rp);padding-left:12px;margin:8px 0}
.acts{display:grid;gap:10px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--cb);color:var(--cr);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}

.rv{margin:0 -4px}
.rv-t{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rv-t::-webkit-scrollbar{display:none}
.rv-t figure{flex:0 0 86%;scroll-snap-align:center;background:#fff;border:1px solid var(--ch);border-radius:16px;padding:8px;display:flex;align-items:center;justify-content:center}
.rv-t img{width:100%;max-height:340px;object-fit:contain;display:block;border-radius:10px}
.rv-n{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.rv-n button{width:38px;height:38px;border-radius:50%;border:1px solid var(--or);background:#fffdf8;font-size:18px;cursor:pointer;color:var(--cb)}
.rv-n span{font-size:13px;color:#7a6f7e;min-width:48px;text-align:center}
.disc{margin-top:16px}
@media print{
body{background:#fff}.no-print,#start,#quiz,#toast{display:none!important}
.wrap{padding:0;max-width:none}.card,.sig{box-shadow:none;break-inside:avoid;animation:none}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

/* ===== FAMILLES DE STORYTELLING ===== */
const FAM={
parcours:m=>({nom:'Storytelling de parcours',s:`Pourquoi tu es devenue ${m.n}`,w:'Une cliente choisit une personne avant de choisir une prestation. Ton parcours montre ce qui te motive et rend ton travail plus humain.',h:[`Je suis devenue ${m.n} pour une raison très précise.`,`Si on m’avait dit [ton ancien projet ou ton point de départ] il y a quelques années, je n’y aurais pas cru.`,`Il y a un moment précis où j’ai su que je ferais ce métier.`],ctx:'il y a [nombre] ans, je faisais [ce que tu faisais avant ou ton point de départ].',his:`[Raconte une scène vraie : où tu étais, ce que tu as ressenti, ce que tu as décidé.] Pour t’aider, pense à ${m.sc}.`,pc:`Aujourd’hui, je comprends que ce métier n’est pas seulement ${m.g} : c’est [ce qu’il t’apporte à toi].`,con:'C’est pour ça que je fais mon métier comme je le fais.',cap:`Aujourd’hui je partage ce qui m’a menée à ce métier : on confie son image à une personne, pas seulement à un service.`}),
exp:m=>({nom:'Storytelling d’expérience professionnelle',s:'Cette situation de travail qui a changé ta façon de faire',w:'Une situation vécue montre ton expertise en action et prouve que tu apprends de ta pratique, ce qui rassure.',h:['Cette situation m’a appris plus que n’importe quelle formation.','Je n’oublierai jamais ce moment de travail (et ce qu’il m’a changé).','Un détail de mon métier a tout changé dans ma façon de travailler.'],ctx:'pendant une prestation, il s’est passé quelque chose que je n’avais pas prévu.',his:'[Raconte la situation sans nom ni détail permettant d’identifier la cliente : ce qui s’est passé, ta réaction.]',pc:'J’ai compris que [ce que tu fais différemment depuis].',con:`Depuis ce jour, ${m.g} ne se passe plus jamais comme avant.`,cap:'Une situation vécue dans mon travail a changé ma manière de faire. Je te la raconte simplement.'}),
valeurs:m=>({nom:'Storytelling des valeurs',s:'La valeur qui guide ta façon de travailler',w:'Une valeur affirmée aide une cliente à savoir à quoi s’attendre avec toi, avant même de réserver.',h:['Il y a une chose que je refuse de faire dans mon métier.','Voilà la règle que je ne change jamais, même quand ce serait plus simple.',`Ce que je défends dans ma pratique de ${m.n} me ressemble.`],ctx:'dans ce métier, on peut faire beaucoup de choses. Moi, j’ai choisi de [ta valeur : prendre le temps, être transparente, ne jamais bâcler…].',his:'[Donne un exemple concret où cette valeur se voit dans ton travail.]',pc:'Cette façon de faire me demande parfois plus de temps ou d’énergie. Mais c’est ce qui rend mon travail juste pour moi.',con:`Mes clientes ne viennent pas seulement pour ${m.g}. Elles viennent aussi pour cette manière de travailler.`,cap:'Il y a une valeur que je ne négocie pas dans mon travail. Voici comment elle se voit concrètement.'}),
coul:m=>({nom:'Storytelling de coulisses',s:'Ce que tu fais avant que ta cliente arrive',w:'Les clientes voient le résultat, rarement la préparation. Montrer les coulisses prouve ton sérieux sans rien révéler de ta vie privée.',h:['Ce que ma cliente ne voit pas avant d’arriver.','Voilà ce que je prépare avant chaque rendez-vous.','Combien de temps je passe à préparer, avant même que ma cliente franchisse la porte ?'],ctx:'quand une cliente arrive, tout est déjà prêt. Ce n’est pas un hasard.',his:`Montre ${m.co} : [les 3 étapes que tu fais toujours].`,pc:'Ces détails qu’on ne voit pas, ce sont eux qui font que [ce que tes clientes ressentent ou disent].',con:'Le résultat se voit. Le sérieux, lui, se prépare.',cap:'On voit le résultat, rarement la préparation. Voici un aperçu de ce qui se passe avant ton rendez-vous.'}),
aut:m=>({nom:'Storytelling d’autorité',s:`Ton avis d’experte sur une idée reçue de ton métier`,w:'Une prise de position claire montre ton expertise bien mieux qu’une liste de diplômes.',h:['Arrête de croire que [idée reçue sur ton métier].',`Ce que je répète le plus souvent à mes clientes, en tant que ${m.n}.`,`Ce que personne n’explique sur ${m.g}, et qui change tout.`],ctx:'on entend souvent que [idée reçue]. Dans ma pratique, je constate autre chose.',his:'[Explique ce que tu observes concrètement dans ton travail : un cas général, sans nom de cliente.]',pc:'Ce que je retiens après [ton nombre d’années] d’expérience : [ta conviction professionnelle].',con:`Quand on comprend ça, on choisit ${m.g} différemment.`,cap:'Une idée reçue revient souvent dans mon métier. Voici ce que j’observe réellement.'}),
pconscience:m=>({nom:'Storytelling de prise de conscience',s:'La leçon que ton métier t’a apprise',w:'Une leçon sincère crée de la proximité et montre que tu évolues, ce qui rassure ta clientèle.',h:['Mon métier m’a appris une chose que je n’attendais pas.',`J’ai mis du temps à comprendre ça sur ${m.g}.`,`Si je pouvais dire une chose à la ${m.n} que j’étais au début…`],ctx:'au début, je pensais que [ta croyance de départ].',his:'[Raconte ce qui t’a fait changer d’avis : une situation, une cliente sans nom, une erreur ou une belle surprise.]',pc:'Aujourd’hui, je sais que [ta leçon en une phrase].',con:'Cette leçon guide encore chacune de mes prestations.',cap:'Mon métier m’a appris une leçon que je n’attendais pas. Je la partage ici.'}),
rel:m=>({nom:'Storytelling de relation cliente',s:'Une expérience cliente qui illustre ta façon d’accueillir',w:'Raconter la relation avec tes clientes montre ce qu’on vit chez toi : un argument que personne ne peut copier.',h:['Il y a une phrase de cliente que je n’oublie pas.','Ce que je ressens quand une cliente me fait confiance.','Ce que mes clientes ne disent pas toujours, mais que je remarque.'],ctx:`une cliente est venue pour ${m.g}, mais elle avait aussi besoin de [écoute, confiance, temps…].`,his:'[Raconte la scène réelle sans nom ni information permettant de la reconnaître : ce qu’elle a dit, ce que tu as fait.]',pc:`J’ai compris que mon rôle ne s’arrête pas à ${m.g} : [ce que tu apportes en plus].`,con:`Ce que j’aime dans mon métier, c’est ${m.sc}.`,cap:`Accueillir une cliente, c’est plus que réaliser ${m.g}. Voici ce que j’essaie d’offrir à chaque rendez-vous.`}),
diff:m=>({nom:'Storytelling de différenciation',s:'Ce qui rend ta façon de travailler différente',w:'Ce que tu fais différemment est ce qui permet à une cliente de te choisir, toi, plutôt qu’une autre professionnelle.',h:['Ce que je fais différemment dans mon métier, et pourquoi.','Ce que j’ai décidé de ne pas faire comme tout le monde.','Un détail de ma façon de travailler que tu ne verras pas partout.'],ctx:'dans mon métier, beaucoup de choses se ressemblent. Moi, j’ai choisi de [ta différence concrète].',his:'[Explique comment ça se passe concrètement et pourquoi tu as fait ce choix.]',pc:'Je ne dis pas que c’est mieux : c’est ma façon d’être alignée avec ce que je crois.',con:'Si ça te parle, tu sais déjà que tu es au bon endroit.',cap:'Voici ce que je fais différemment, et pourquoi c’est important pour moi.'})
};

/* ===== LOGIQUE ===== */
function pickFamily(a){
  let f=['parcours','parcours','coul','valeurs','pconscience','rel'][a[3]];
  if(a[3]===1)f='parcours';
  if(a[1]===2)f='diff';
  if(a[3]!==2&&(a[8]===3||(a[2]===0&&a[8]===3)))f='aut';
  if(a[2]===0&&a[6]===0&&a[3]===1)f='aut';
  if((a[7]===5||a[7]===2)&&f==='parcours')f='exp';
  if(a[7]===4&&f!=='coul')f='coul';
  if(a[1]===1&&a[8]===1&&f==='parcours')f='rel';
  return f;
}
function pickFormat(a){
  let k=['face','voix','texte','carP','carT'][a[5]];
  if(!k){
    if(a[4]===2||a[7]===5||a[4]===5)k='voix';
    else k=[0,1,5].includes(a[6])?'face':'voix';
  }
  return k;
}
const FMT={
face:{t:'Reel face caméra de 30 à 45 secondes',why:'Tu aimes parler à ta caméra : ce format crée la proximité la plus rapide avec une future cliente.',reel:1,ph:'Filme dans ton lieu de travail, en lumière naturelle ou face à une fenêtre, puis ajoute 2 ou 3 plans de tes mains ou de ton espace.',fi:'Filme en vertical, caméra à hauteur des yeux, une phrase à la fois, puis garde les meilleures prises.',ry:'Une idée toutes les 3 à 5 secondes, sans silence inutile.'},
voix:{t:'Reel en voix off de 20 à 35 secondes',why:'Tu peux raconter sans te filmer : ta voix porte l’émotion pendant que tes images montrent ton travail.',reel:1,ph:'Plans de tes mains au travail, de ton matériel et de ton espace, sans montrer ton visage si tu préfères.',fi:'Enregistre ta voix à part, au calme, en lisant ton texte à voix naturelle, puis pose-la sur tes plans.',ry:'Un plan toutes les 2 à 4 secondes, calé sur ta voix.'},
texte:{t:'Reel court avec texte à l’écran, 10 à 20 secondes',why:'Ce format te permet de dire l’essentiel sans parler : idéal pour un message simple et net.',reel:1,ph:'Une vidéo ou 3 plans courts de ton travail, avec une phrase à l’écran lisible en 2 secondes.',fi:'Filme en vertical, plans stables, laisse de la place au texte en haut ou au centre de l’écran.',ry:'Un texte par plan, 8 mots maximum, 2 secondes de lecture.'},
carP:{t:'Carrousel de 5 à 7 slides avec photos',why:'Le carrousel te laisse raconter à ton rythme, et tes photos de travail servent de preuve.',reel:0,ph:'Choisis 5 à 7 photos nettes de ton travail et de ton espace, et un portrait de toi si tu le souhaites.',fi:'Photos en lumière naturelle, cadrage vertical 4:5, même ambiance de couleurs sur toutes les slides.',ry:'Une phrase courte par slide, 20 mots maximum.'},
carT:{t:'Carrousel de 5 à 7 slides avec texte',why:'Tu préfères écrire : le texte te permet de poser ton histoire sans te montrer.',reel:0,ph:'Fond uni aux couleurs de ta marque, une idée par slide, police grande et lisible.',fi:'Garde la même mise en page sur toutes les slides et une marge confortable autour du texte.',ry:'Une idée par slide, 20 mots maximum, un peu d’air autour.'}
};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1)}

function build(a,custom){
  const m=a[0]===8?{n:(custom||'').trim()||'professionnelle de la beauté',g:'une prestation',sc:'le moment où une cliente découvre le résultat',co:'ma préparation avant l’arrivée d’une cliente',tg:[((custom||'').toLowerCase().replace(/[^a-zà-ÿ]/g,''))||'beautépro','professionnelledelabeauté','beauté']}:M[a[0]];
  const fk=pickFamily(a),F=FAM[fk](m),fk2=pickFormat(a),f=FMT[fk2],T=TONE[a[6]];
  const profil=PROF[a[2]];
  const why=`Tu veux être perçue comme ${PERC[a[2]]}, avec un ton ${T.d}. Ton objectif : ${GOAL[a[1]]}. ${a[7]>=4?'Tu préfères garder la main sur ce que tu dévoiles : ton storytelling reste centré sur ton activité.':'Tu es prête à te dévoiler un peu : ton histoire peut aussi donner à voir la personne derrière la professionnelle.'}`;
  const ctx=T.p+F.ctx;
  const con=F.con+' '+MSG[a[8]];
  const cta=CTA[a[1]];
  const parts=f.reel
   ?[['Accroche',F.h[0]],['Contexte',cap1(ctx)],['Ton histoire (à personnaliser)',F.his],['Prise de conscience',F.pc],['Conclusion',con],['Appel à l’action',cta]]
   :[['Slide 1 · Hook',F.h[0]],['Slide 2 · Mise en situation',cap1(ctx)],['Slide 3 · Développement','Pourquoi c’est important pour mes clientes : [une raison concrète].'],['Slide 4 · Ton expérience',F.his],['Slide 5 · Prise de conscience',F.pc],['Slide 6 · Conclusion',con],['Slide 7 · CTA',cta]];
  const tips=[['Photos / vidéos',f.ph],['Comment filmer',f.fi],['Rythme',f.ry],['À mettre en avant',`Ce qui est vrai et précis, comme ${m.sc}. Les détails concrets valent mieux que les grandes phrases.`],['À éviter',BLOC[a[4]]]];
  if(a[7]>=4)tips.push(['Ton niveau de confort','Reste sur ton activité : aucun détail personnel n’est nécessaire pour que ton histoire fonctionne.']);
  if(a[4]===2&&fk2==='face')tips.push(['Ton niveau de confort','Si la caméra te freine, commence par les 2 premières phrases seulement, puis complète en voix off.']);
  const kw=`${m.n}, ${m.tg[0]}`;
  const caption=`${F.h[1]}\n\n${F.cap}\n\n${kw}\n\n${CAPCTA[a[1]]}`;
  const tags=['#'+m.tg[0],'#'+m.tg[1],'#'+m.tg[2],'#storytellingbeauté','#instagrambeauté'];
  return{profil,why,fam:F.nom,sujet:F.s,w:F.w,hooks:[['Accroche directe',F.h[0]],['Accroche personnelle',F.h[1]],['Accroche curiosité',F.h[2]]],fmt:f.t,fwhy:f.why,parts,tips,caption,tags,reel:f.reel};
}
function toText(r){
  const L=[];
  L.push('TON PREMIER STORYTELLING · BVA ACADÉMIE','','PROFIL : '+r.profil,r.why,'','SUJET : '+r.sujet,r.w,'','TES 3 ACCROCHES');
  r.hooks.forEach(h=>L.push('- '+h[0]+' : '+h[1]));
  L.push('','FORMAT : '+r.fmt,r.fwhy,'',r.reel?'TON SCRIPT':'TES SLIDES');
  r.parts.forEach(p=>L.push(p[0]+' : '+p[1]));
  L.push('','CONSEILS DE CRÉATION');r.tips.forEach(t=>L.push('- '+t[0]+' : '+t[1]));
  L.push('','LÉGENDE INSTAGRAM',r.caption,r.tags.join(' '),'','CHECKLIST','- Choisir mon accroche','- Personnaliser mon histoire','- Filmer ou créer mes visuels','- Préparer ma description','- Publier mon storytelling','','BVA ACADÉMIE · Attire, convaincs et fidélise tes clientes grâce à une communication qui te ressemble.',CFG.insta);
  return L.join('\n');
}

/* ===== INTERFACE ===== */
let a=[],i=-1,custom='',R=null;
const $=id=>document.getElementById(id);
function show(w){['start','quiz','res'].forEach(k=>$(k).hidden=k!==w);window.scrollTo(0,0)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}
function home(){
  $('start').innerHTML=`<div class="card"><h1>Et si ton histoire était ton meilleur contenu Instagram ?</h1><p class="sub">En quelques questions, découvre comment transformer ton parcours, tes valeurs et ta personnalité en un storytelling qui donne envie à tes futures clientes de te connaître.</p><ul class="ben"><li>Un sujet adapté à ton métier.</li><li>Une accroche qui te correspond.</li><li>Un contenu prêt à personnaliser.</li></ul><button class="btn pri full" id="go">Je découvre mon storytelling</button><p class="mini">Un outil gratuit imaginé par Clem, fondatrice de BVA Académie.</p></div>`;
  $('go').onclick=()=>{i=0;show('quiz');ask()};show('start');
}
function ask(){
  const q=Q[i],sel=a[i],pct=Math.round(i/Q.length*100);
  let h=`<div class="bar"><i style="width:${pct+Math.round(100/Q.length/2)}%"></i></div><div class="step">QUESTION ${i+1} SUR ${Q.length}</div><div class="card"><h2>${q.q}</h2>`;
  q.o.forEach((o,k)=>h+=`<button class="opt${sel===k?' on':''}" data-k="${k}">${o}</button>`);
  if(q.other!==undefined&&sel===q.other)h+=`<input class="oth" id="oth" maxlength="40" placeholder="Ton métier (ex. : barbière, nail artist…)" value="${esc(custom)}">`;
  h+=`</div><div class="nav"><button class="btn sec" id="back">Retour</button><button class="btn pri" id="next"${sel===undefined?' disabled':''}>${i===Q.length-1?'Voir mon résultat':'Suivant'}</button></div>`;
  $('quiz').innerHTML=h;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{a[i]=+b.dataset.k;ask()});
  const o=$('oth');if(o){o.oninput=()=>custom=o.value}
  $('back').onclick=()=>{if(i===0){home()}else{i--;ask()}};
  $('next').onclick=()=>{if(i===Q.length-1)finish();else{i++;ask()}};
}
function finish(){R=build(a,custom);draw();show('res')}
function sec(tag,title,body){return`<div class="card r"><div class="r-tag">${tag}</div>${title?`<h3>${title}</h3>`:''}${body}</div>`}
function draw(){
  const r=R;let h=`<h1>Ton premier storytelling commence ici.</h1><p class="sub">Ton mini-diagnostic de communication · ${esc(r.fam)}</p>`;
  h+=sec('A · Ton profil de communication',esc(r.profil),`<p>${esc(r.why)}</p>`);
  h+=sec('B · Ton sujet de storytelling',esc(r.sujet),`<p>${esc(r.w)}</p>`);
  h+=sec('C · Ton accroche Instagram','',r.hooks.map(x=>`<div class="hook"><b>${x[0]}</b>${esc(x[1])}</div>`).join(''));
  h+=sec('D · Le format recommandé',esc(r.fmt),`<p>${esc(r.fwhy)}</p>`);
  h+=sec('E · '+(r.reel?'Ton script prêt à créer':'Tes slides prêtes à créer'),'',`<p class="q">Les passages entre [crochets] sont à compléter avec ta vraie histoire.</p>`+r.parts.map(p=>`<div class="beat"><b>${esc(p[0])}</b>${esc(p[1])}</div>`).join(''));
  h+=sec('F · Conseils de création','','<ul>'+r.tips.map(t=>`<li><b>${esc(t[0])} :</b> ${esc(t[1])}</li>`).join('')+'</ul>');
  h+=sec('G · Ta description Instagram','',`<p>${esc(r.caption).replace(/\n/g,'<br>')}</p><p><b>${esc(r.tags.join(' '))}</b></p>`);
  h+=sec('H · Ta prochaine action','','<ul class="chk"><li>Choisir mon accroche</li><li>Personnaliser mon histoire</li><li>Filmer ou créer mes visuels</li><li>Préparer ma description</li><li>Publier mon storytelling</li></ul><p>Tu as déjà tout ce qu’il faut pour commencer : une seule histoire, bien choisie, suffit pour poser ta première pierre.</p>');
  h+=`<div class="sig"><h3>Un dernier conseil de Clem 💗</h3><p>Le storytelling, ce n’est pas raconter toute ta vie sur Instagram. C’est choisir les bonnes histoires pour montrer qui tu es, ce qui te différencie et pourquoi une cliente devrait te faire confiance.</p><div class="b">BVA ACADÉMIE</div><p style="margin-top:6px">Attire, convaincs et fidélise tes clientes grâce à une communication qui te ressemble.</p><p style="margin-top:12px">Retrouve Clem sur Instagram : <a href="${CFG.instaUrl}" target="_blank" rel="noopener">${esc(CFG.insta)}</a></p></div>`;
  h+=`<div class="card no-print r"><div class="r-tag">Elles en parlent</div><h3>Les retours des pros de la beauté accompagnées par Clem</h3><div class="rv"><div class="rv-t" id="rvt">${REVIEWS.map((u,k)=>`<figure><img src="${u}" alt="Retour client BVA Académie ${k+1}" loading="lazy"></figure>`).join('')}</div><div class="rv-n"><button id="rvp" aria-label="Précédent">‹</button><span id="rvc">1 / ${REVIEWS.length}</span><button id="rvn" aria-label="Suivant">›</button></div></div><a class="btn pri full disc" style="text-align:center;text-decoration:none" href="${CFG.vente}" target="_blank" rel="noopener">Découvrir l’accompagnement</a></div>`;
  h+=`<div class="acts no-print"><button class="btn pri" id="pdf">Télécharger mon storytelling en PDF</button><button class="btn sec" id="cp">Copier mon contenu</button><button class="btn sec" id="rs">Recommencer le quiz</button></div>`;
  $('res').innerHTML=h;
  const t=$('rvt'),upd=()=>{const w=t.firstElementChild.offsetWidth+12;$('rvc').textContent=(Math.min(REVIEWS.length,Math.round(t.scrollLeft/w)+1))+' / '+REVIEWS.length};
  t.onscroll=upd;$('rvp').onclick=()=>t.scrollBy({left:-t.firstElementChild.offsetWidth-12,behavior:'smooth'});$('rvn').onclick=()=>t.scrollBy({left:t.firstElementChild.offsetWidth+12,behavior:'smooth'});
  $('pdf').onclick=()=>{toast('Choisis « Enregistrer au format PDF » dans la fenêtre d’impression');setTimeout(()=>window.print(),700)};
  $('cp').onclick=()=>{const t=toText(r);
    const ok=()=>toast('Contenu copié 💗');
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fb)}else fb();
    function fb(){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');ok()}catch(e){toast('Copie impossible, sélectionne le texte à la main')}x.remove()}};
  $('rs').onclick=()=>{a=[];custom='';i=-1;R=null;home()};
}
home();
</script>
</body>
</html>
